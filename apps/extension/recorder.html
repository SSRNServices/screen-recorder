<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScreenRecorder - Active Session</title>
    <link rel="icon" type="image/png" href="/icons/icon32.png" />
    <style>
      :root {
        --bg-primary: #0f172a;
        --bg-surface: #1e293b;
        --bg-surface-hover: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --danger: #ef4444;
        --danger-hover: #dc2626;
        --warning: #f59e0b;
        --warning-hover: #d97706;
        --success: #10b981;
        --border: #334155;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

      body {
        background-color: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .recorder-card {
        background-color: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        width: 100%;
        max-width: 520px;
        padding: 32px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      }

      .header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
      }

      .header-icon {
        width: 32px;
        height: 32px;
      }

      .header h1 {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 14px;
        border-radius: 9999px;
        font-size: 0.85rem;
        font-weight: 600;
        background-color: var(--border);
        color: var(--text-secondary);
        margin-bottom: 20px;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--text-muted);
      }

      .status-dot.recording {
        background-color: var(--danger);
        animation: pulse 1.5s infinite;
      }

      .status-dot.paused {
        background-color: var(--warning);
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }

      .timer-display {
        font-size: 3rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-align: center;
        margin: 20px 0;
        color: var(--text-primary);
        letter-spacing: 0.05em;
      }

      .button-group {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }

      button {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 20px;
        font-size: 0.95rem;
        font-weight: 600;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        transition: background-color 0.15s ease, transform 0.05s ease;
      }

      button:active {
        transform: scale(0.98);
      }

      .btn-primary {
        background-color: var(--primary);
        color: white;
      }
      .btn-primary:hover { background-color: var(--primary-hover); }

      .btn-danger {
        background-color: var(--danger);
        color: white;
      }
      .btn-danger:hover { background-color: var(--danger-hover); }

      .btn-warning {
        background-color: var(--warning);
        color: white;
      }
      .btn-warning:hover { background-color: var(--warning-hover); }

      .btn-secondary {
        background-color: var(--bg-surface-hover);
        color: var(--text-primary);
      }
      .btn-secondary:hover { background-color: var(--border); }

      .info-box {
        margin-top: 20px;
        padding: 14px;
        border-radius: 8px;
        background-color: rgba(37, 99, 235, 0.1);
        border: 1px solid rgba(37, 99, 235, 0.25);
        color: var(--text-secondary);
        font-size: 0.85rem;
        line-height: 1.4;
      }

      .completed-info {
        background-color: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.3);
        padding: 16px;
        border-radius: 8px;
        margin-top: 16px;
      }

      .completed-info h3 {
        color: var(--success);
        font-size: 1rem;
        margin-bottom: 8px;
      }

      .file-detail {
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin: 4px 0;
        word-break: break-all;
      }

      .error-alert {
        background-color: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #fca5a5;
        padding: 14px;
        border-radius: 8px;
        margin-top: 16px;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div id="recorder-app">
      <div class="recorder-card">
        <div class="header">
          <img src="/icons/icon32.png" alt="ScreenRecorder" class="header-icon" />
          <h1>ScreenRecorder Session</h1>
        </div>

        <div id="status-pill" class="status-pill">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-text">Ready</span>
        </div>

        <div id="timer" class="timer-display">00:00:00</div>

        <div id="action-buttons" class="button-group">
          <!-- Dynamic action buttons injected via recorder.ts -->
        </div>

        <div id="details-section"></div>

        <div class="info-box">
          <strong>Tip:</strong> Keep this tab open while recording. You can switch to any application, window, or monitor.
        </div>
      </div>
    </div>

    <script type="module" src="/src/recorder/index.ts"></script>
  </body>
</html>
