name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Tests
        run: npm test

      - name: Build Extension & Packages
        run: npm run build

      - name: Validate Artifacts & Manifest
        run: npm run validate:artifacts

      - name: Security Audit (High/Critical)
        run: npm audit --audit-level=high

      - name: Package Extension
        run: node scripts/package-extension.mjs

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: screenrecorder-extension-preview
          path: |
            release/*.zip
            release/SHA256SUMS.txt
          retention-days: 14
