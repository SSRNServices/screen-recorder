name: Windows Build & Validation

on:
  push:
    branches: [main]
    paths:
      - 'apps/native-host/**'
      - 'packages/protocol/**'
      - 'scripts/**'
      - 'installer/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/native-host/**'
      - 'packages/protocol/**'
      - 'scripts/**'
      - 'installer/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-matrix:
    name: Windows Native Host & Build Validation
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS (v20)
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm test

      - name: Build All Workspaces
        run: npm run build

      - name: Validate Build Artifacts
        run: npm run validate:artifacts

      - name: Test Windows Packaging
        run: node scripts/package-extension.mjs
